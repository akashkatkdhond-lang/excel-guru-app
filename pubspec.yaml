name: excel_guru
description: "Excel Guru - Learn Microsoft Excel in Hindi with lessons, quizzes and a live formula simulator."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local storage (progress, premium flag, quiz scores)
  shared_preferences: ^2.2.3

  # Ads (AdMob) - primary monetization
  google_mobile_ads: ^5.1.0

  # Premium unlock (one-time purchase / remove ads)
  in_app_purchase: ^3.2.0

  # Native share sheet (score sharing, referral, certificate sharing)
  share_plus: ^10.0.0

  # Save certificate image to a temp file before sharing
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Add assets (app icon source, lesson images) here once you add them:
  # assets:
  #   - assets/images/
