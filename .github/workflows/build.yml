name: Build Excel Guru APK

# Runs automatically on every push to main, and can also be triggered
# manually from the "Actions" tab on GitHub (Run workflow button).
# No local Windows admin rights are needed — everything builds on
# GitHub's own cloud machines.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK (installable, unsigned)
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: excel-guru-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # If the signing secrets are configured (Settings > Secrets and
      # variables > Actions), decode the keystore and write key.properties
      # so the release build below is signed with the REAL release key
      # instead of falling back to the debug key. This lets the output go
      # straight to the Play Store — no separate local signing step needed.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured — release build will fall back to the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Build release APK (installable directly on a phone)
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: excel-guru-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build release AAB (required format for Play Store upload)
        run: flutter build appbundle --release

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: excel-guru-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
