name: Build Excel Guru APK

# Runs automatically on every push to main, and can also be triggered
# manually from the "Actions" tab on GitHub (Run workflow button).
# No local Windows admin rights are needed — everything builds on
# GitHub's own cloud machines.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK (installable, unsigned)
        run: flutter build apk --debug

      - name: Build release APK (needs signing before Play Store upload)
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: excel-guru-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: excel-guru-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
